services:
  - type: web
    name: payminute
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_REQUIRED
        value: "true"
      - key: PAYMINUTE_PHONE_REGION
        value: US
      - key: DATABASE_PATH
        value: /tmp/payminute.db
      - key: PAYPAL_MCP
        value: "on"
      - key: KERNEL_API_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: STUDIO_OPENAI_API_KEY
        sync: false
      - key: ZAPIER_MCP_URL
        sync: false
